paths:
  raw_dir: datasets/raw
  processed_dir: datasets/processed
  output_dir: outputs

ingestion:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
  recursive: true
  mode: copy

inference:
  backend: mock         # mock | local | api
  # local/HF hub id example: Qwen/Qwen2.5-VL-3B-Instruct
  # DashScope API model id example: qwen-vl-plus / qwen2.5-vl-3b-instruct
  model_name: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  max_new_tokens: 128
  max_pixels: 352800
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: QWEN_API_KEY
  api_timeout: 120

logging:
  level: INFO
  log_file: outputs/logs/ingestion.log