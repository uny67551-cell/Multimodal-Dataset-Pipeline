paths:
  raw_dir: datasets/raw
  processed_dir: datasets/processed
  output_dir: outputs

ingestion:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
  recursive: true
  mode: copy

inference:
  backend: api        # mock | local | api
  # local/HF hub id example: Qwen/Qwen2.5-VL-3B-Instruct
  # DashScope API model id example: qwen-vl-plus / qwen2.5-vl-3b-instruct
  model_name: qwen-vl-plus # qwen-vl-plus ;Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  max_new_tokens: 128
  max_pixels: 352800
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: QWEN_API_KEY
  api_timeout: 120

# metadata:
#   Uses:
#     outputs/ingestion_report.json
#     outputs/inference_report.json
#   Writes:
#     outputs/metadata_report.json

qc:
  blur_threshold: 100.0
  # Laplacian variance below this => is_blurry
  # Writes: outputs/qc_report.json

export:
  export_dir: outputs/export
  exclude_duplicates: true
  include_blurry: false
  require_caption: true
  # Always copies included images into export_dir/images/
  # Writes:
  #   outputs/export/annotations.jsonl
  #   outputs/export/export_report.json
  
logging:
  level: INFO
  log_file: outputs/logs/ingestion.log